# Test fixture — correct secretKeyRef usage; scanner must pass this.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-api-good
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-api-good
  template:
    metadata:
      labels:
        app: cart-api-good
    spec:
      containers:
        - name: cart-api
          image: registry.example.com/cart-api:1.5.0
          env:
            - name: DIAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cart-api-secrets
                  key: DIAL_API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cart-api-secrets
                  key: DATABASE_URL
