name: Security — k8s manifest secrets scan

on:
  push:
    paths:
      - "k8s/**"
      - "**.yaml"
      - "**.yml"
  pull_request:
    paths:
      - "k8s/**"
      - "**.yaml"
      - "**.yml"

permissions:
  contents: read

jobs:
  manifest-secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"

      - name: Install pyyaml
        run: pip install pyyaml==6.0.2

      - name: Scan k8s manifests for plaintext credentials (T-07 preventive)
        run: python scripts/check_k8s_secrets.py k8s
        # Fails the workflow if any env.value contains DIAL_API_KEY, DATABASE_URL,
        # sk-live-* patterns, or postgres://user:pass@ URLs.
        # Fix: move to secretKeyRef (see Artefacts/800-wide/02-deploy-manifest.md).
